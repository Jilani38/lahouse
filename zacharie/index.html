<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2219">
<meta name="robots" content="noindex">
<title>LA HOUSE · Zacharie</title>
<meta property="og:title" content="LA HOUSE · Pass VIP">
<meta property="og:description" content="Un jour, tu sauras.">
<link rel="icon" href="../assets/star.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mr+Dafoe&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<link rel="preload" as="image" href="../assets/logo.webp">
</head>
<body>
<div class="stripes"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow"></div>
<div class="vignette"></div>
<div class="frame" aria-hidden="true">
  <svg><rect class="r1" pathLength="1"/><rect class="r2" pathLength="1"/></svg>
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
</div>

<main class="stage">
  <p class="kicker rv" style="--d:.2s">La House · Pass VIP</p>

  <div class="emblem">
    <div class="halo"></div>
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#c9a86a"/></linearGradient></defs>
      <circle class="dots" cx="50" cy="50" r="53"/>
      <circle class="track" cx="50" cy="50" r="48"/>
      <circle class="prog" cx="50" cy="50" r="48" pathLength="100"/>
      <circle class="spark" cx="50" cy="2" r="1.6"/>
    </svg>
    <img src="../assets/logo.webp" alt="LA HOUSE" width="600" height="600">
  </div>

  <h1 class="name">Zacharie,</h1>
  <p class="lead rv" style="--d:2.2s">quelque chose t’attend dans</p>

  <div class="countdown rv" style="--d:1.4s" role="timer" aria-label="Compte à rebours jusqu'au 20 mars 2027">
    <div class="unit d"><div class="num"></div><span class="lbl">Jours</span></div>
    <span class="sep"></span>
    <div class="unit h"><div class="num"></div><span class="lbl">Heures</span></div>
    <span class="sep"></span>
    <div class="unit m"><div class="num"></div><span class="lbl">Min</span></div>
    <span class="sep"></span>
    <div class="unit s"><div class="num"></div><span class="lbl">Sec</span></div>
  </div>

  <p class="open">C'est l'heure.<small>Reviens très vite ici…</small></p>

  <p class="date rv" style="--d:2.5s">20 · 03 · 2027</p>
  <p class="hint rv" style="--d:2.8s">Garde ta carte précieusement.</p>
</main>

<p class="motto rv" style="--d:3s"><i></i>One house, one family<i></i></p>

<script src="../assets/config.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
